<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trace Electric — Coming Soon</title>
<meta name="description" content="Trace Electric's new website is coming soon. Residential and commercial electrical services in the Greater Cincinnati area.">
<link rel="icon" type="image/png" href="trace-electric-icon-512.png">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-DMHW075PYV"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-DMHW075PYV');
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --orange: #ff4b0b; --ink: #111111; }
  html, body { height: 100%; }
  body {
    background: var(--ink);
    color: #f5f5f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    min-height: 100vh; text-align: center; padding: 1.5rem 1.25rem;
    background-image: radial-gradient(ellipse 80% 55% at 50% 30%, rgba(255,75,11,.14), transparent 70%);
  }
  .wrap { max-width: 520px; width: 100%; margin: auto; }
  .logo {
    width: min(210px, 55vw); height: auto; display: block; margin: 0 auto 1.1rem;
    background: #fff; border-radius: 14px; padding: 1rem 1.2rem;
    box-shadow: 0 0 60px rgba(255,75,11,.25);
  }
  h1 {
    font-size: clamp(1.5rem, 5.5vw, 2.2rem); letter-spacing: .35em; text-indent: .35em;
    text-transform: uppercase; margin-bottom: .5rem; font-weight: 800;
  }
  h1 .bolt { color: var(--orange); }
  .tagline { color: #bdbdbd; font-size: .92rem; line-height: 1.55; margin-bottom: 1.2rem; }
  .countdown { display: flex; gap: .5rem; justify-content: center; margin-bottom: .5rem; }
  .countdown div {
    background: rgba(255,255,255,.04); border: 1px solid rgba(255,75,11,.35);
    border-radius: 12px; min-width: 66px; padding: .65rem .3rem;
  }
  .countdown span { display: block; font-size: 1.55rem; font-weight: 800; color: var(--orange); font-variant-numeric: tabular-nums; }
  .countdown label { font-size: .62rem; letter-spacing: .18em; text-transform: uppercase; color: #999; }
  .launch-note { color: #888; font-size: .8rem; margin-bottom: 1.2rem; }
  .cta { display: flex; gap: .7rem; justify-content: center; flex-wrap: wrap; margin-bottom: 1.4rem; }
  .cta a {
    text-decoration: none; font-weight: 700; font-size: .92rem;
    padding: .8rem 1.5rem; border-radius: 10px; transition: transform .15s ease, box-shadow .15s ease;
  }
  .cta a:hover { transform: translateY(-2px); }
  .cta .call { background: var(--orange); color: #111; box-shadow: 0 6px 24px rgba(255,75,11,.4); }
  .cta .mail { background: transparent; color: #f5f5f5; border: 1px solid #555; }
  footer { color: #777; font-size: .75rem; letter-spacing: .08em; line-height: 2; }
  footer a { color: var(--orange); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <main class="wrap">
    <img class="logo" src="trace-electric-logo-stripe.png" alt="Trace Electric logo">
    <h1>Coming <span class="bolt">Soon</span></h1>
    <p class="tagline">Our new website is on the way. We're still wiring things up behind the scenes &mdash; check back shortly.</p>
    <div class="countdown" id="countdown">
      <div><span id="cd-d">--</span><label>Days</label></div>
      <div><span id="cd-h">--</span><label>Hours</label></div>
      <div><span id="cd-m">--</span><label>Mins</label></div>
      <div><span id="cd-s">--</span><label>Secs</label></div>
    </div>
    <p class="launch-note" id="launch-note">Going live Monday, October 12 at 8:00 AM Eastern</p>
    <div class="cta">
      <a class="call" href="tel:+15134020819">(513) 402-0819</a>
      <a class="mail" href="mailto:daniel@bridgestreetremodeling.com">Email Us</a>
    </div>
    <footer>&copy; 2026 Trace Electric &middot; Greater Cincinnati, Ohio<br>Built by <a href="https://fullsitesolutions.com">FullSite Solutions</a></footer>
  </main>
<script>
  const target = new Date('2026-10-12T08:00:00-04:00').getTime();
  const LIVE_URL = 'https://trace-electric-production.up.railway.app';
  const pad = n => String(n).padStart(2, '0');
  let launched = false;
  function tick() {
    const diff = target - Date.now();
    if (diff <= 0) {
      if (!launched) {
        launched = true;
        clearInterval(timer);
        document.getElementById('countdown').style.display = 'none';
        document.getElementById('launch-note').textContent = "We're live — taking you to the new site…";
        setTimeout(() => { window.location.href = LIVE_URL; }, 2500);
      }
      return;
    }
    const d = Math.floor(diff / 864e5), h = Math.floor(diff % 864e5 / 36e5),
          m = Math.floor(diff % 36e5 / 6e4), s = Math.floor(diff % 6e4 / 1e3);
    document.getElementById('cd-d').textContent = d;
    document.getElementById('cd-h').textContent = pad(h);
    document.getElementById('cd-m').textContent = pad(m);
    document.getElementById('cd-s').textContent = pad(s);
  }
  tick();
  const timer = setInterval(tick, 1000);
</script>
</body>
</html>
